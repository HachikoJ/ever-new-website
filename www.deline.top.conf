# Ever New main route: canonical host and product hand-off.
# Install this file in Nginx's conf.d directory. TLS certificates are managed
# by the host's certificate automation; duplicate the same locations in the
# HTTPS server block when TLS terminates at Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name deline.top;

    return 308 https://www.deline.top$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.deline.top;

    root /var/www/deline-website;
    index index.html;
    server_tokens off;

    location = /reader {
        return 308 https://reader.deline.top/$is_args$args;
    }

    location ^~ /reader/ {
        return 308 https://reader.deline.top/$is_args$args;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/index.html $uri.html =404;
        expires -1;
    }

    location ^~ /_next/static/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|git|svn|htaccess|htpasswd|log|bak|backup|sql|conf|ini|map)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/www.deline.top.access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/www.deline.top.error.log warn;
}
